[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-your-data"
version = "0.1.0"
description = "Pregúntale a una base de datos SQL en lenguaje corriente. El agente escribe la consulta, comprueba que solo lee datos, la ejecuta y explica el resultado."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "laulys" }]
keywords = ["llm", "sql", "text-to-sql", "agent", "streamlit", "langchain-alternative"]

dependencies = [
    "sqlalchemy>=2.0,<3",
    "sqlglot>=25,<28",
    "pandas>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.0,<15",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<3"]
anthropic = ["anthropic>=0.34,<1"]
watsonx = ["ibm-watsonx-ai>=1.0,<2"]
mysql = ["pymysql>=1.1,<2"]
ui = ["streamlit>=1.36,<2", "altair>=5.0,<6"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
nlsql = "nlsql.cli:main"

[project.urls]
Repository = "https://github.com/laulys/ask-your-data"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
